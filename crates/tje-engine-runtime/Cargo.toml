[package]
name = "tje-engine-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["devices"]
devices = ["dep:tje-native-platform", "dep:genesis-config", "dep:jgenesis-common"]
# Non-shipping structural evidence. It cannot invoke or certify a source root.
call-window-proofs = ["devices"]

[dependencies]
tje-engine-core = { path = "../tje-engine-core" }
tje-game = { path = "../tje-game" }
tje-mem = { path = "../tje-mem" }
tje-rom = { path = "../tje-rom" }
tje-native-platform = { path = "../tje-native-platform", default-features = false, optional = true }
genesis-config = { path = "../../vendor/jgenesis/config/genesis-config", optional = true }
jgenesis-common = { path = "../../vendor/jgenesis/common/jgenesis-common", optional = true }

[dev-dependencies]
m68000-emu = { path = "../../vendor/jgenesis/cpu/m68000-emu" }
bincode = "2"
genesis-core = { path = "../../vendor/jgenesis/backend/genesis-core" }
