[package]
name = "tje-extended-view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Opt-in RAM-map extended-view renderer experiment; not used by faithful frontends"

[features]
default = []
preview = ["dep:tje-engine-cranelift", "dep:tje-session", "dep:genesis-config", "dep:clap"]
enhanced-mode = ["dep:tje-game", "dep:tje-engine-runtime", "tje-engine-runtime/enhanced-mode"]

[dependencies]
tje-mem = { path = "../tje-mem" }
tje-rom = { path = "../tje-rom" }
tje-game = { path = "../tje-game", optional = true }
tje-engine-runtime = { path = "../tje-engine-runtime", default-features = false, optional = true }
tje-engine-cranelift = { path = "../tje-engine-cranelift", optional = true }
tje-session = { path = "../tje-session", optional = true }
genesis-config = { path = "../../vendor/jgenesis/config/genesis-config", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[[example]]
name = "preview"
required-features = ["preview"]
