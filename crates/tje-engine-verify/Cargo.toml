[package]
name = "tje-engine-verify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
native = ["dep:tje-engine-cranelift"]

[dependencies]
anyhow = "1"
bincode = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tje-game = { path = "../tje-game" }
tje-mem = { path = "../tje-mem" }
tje-rom = { path = "../tje-rom" }
tje-session = { path = "../tje-session" }
tje-engine-core = { path = "../tje-engine-core" }
tje-engine-runtime = { path = "../tje-engine-runtime", features = ["devices"] }
tje-native-platform = { path = "../tje-native-platform", default-features = false }
genesis-core = { path = "../../vendor/jgenesis/backend/genesis-core" }
genesis-config = { path = "../../vendor/jgenesis/config/genesis-config" }
jgenesis-common = { path = "../../vendor/jgenesis/common/jgenesis-common" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tje-engine-cranelift = { path = "../tje-engine-cranelift", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
m68000-emu = { path = "../../vendor/jgenesis/cpu/m68000-emu" }
