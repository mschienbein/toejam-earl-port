[package]
name = "tje-engine-wasmgen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Development harness only: the retail frontend must never enable this oracle.
browser-proof = ["dep:tje-engine-verify", "dep:tje-rom", "dep:tje-session", "dep:serde", "dep:serde_json", "dep:m68000-emu"]

[dependencies]
tje-engine-core = { path = "../tje-engine-core" }
tje-engine-runtime = { path = "../tje-engine-runtime", default-features = false }
wasm-encoder = { version = "0.245.1", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
tje-engine-verify = { path = "../tje-engine-verify", optional = true }
tje-rom = { path = "../tje-rom", optional = true }
tje-session = { path = "../tje-session", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
m68000-emu = { path = "../../vendor/jgenesis/cpu/m68000-emu", optional = true }

[dev-dependencies]
wasmparser = "0.245.1"
