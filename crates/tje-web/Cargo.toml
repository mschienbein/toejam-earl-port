[package]
name = "tje-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
genesis-config = { path = "../../vendor/jgenesis/config/genesis-config" }
jgenesis-common = { path = "../../vendor/jgenesis/common/jgenesis-common" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = "1"
console_error_panic_hook = "0.1"
tje-host = { path = "../tje-host" }
tje-rom = { path = "../tje-rom" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
