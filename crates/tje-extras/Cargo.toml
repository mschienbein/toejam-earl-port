[package]
name = "tje-extras"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared explicit profile selection for extended view and in-play Jam Out"

[features]
default = []
enhanced-mode = ["dep:tje-engine-runtime", "dep:tje-game", "dep:bincode", "tje-extended-view/enhanced-mode", "tje-jam-out/enhanced-mode"]
preview = ["enhanced-mode", "dep:tje-engine-cranelift", "dep:tje-rom", "dep:tje-session", "dep:genesis-config", "dep:sha1"]

[dependencies]
tje-extended-view = { path = "../tje-extended-view" }
tje-jam-out = { path = "../tje-jam-out" }
tje-mem = { path = "../tje-mem" }
tje-game = { path = "../tje-game", optional = true }
tje-engine-runtime = { path = "../tje-engine-runtime", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["derive"], optional = true }
tje-engine-cranelift = { path = "../tje-engine-cranelift", optional = true, features = ["enhanced-mode"] }
tje-rom = { path = "../tje-rom", optional = true }
tje-session = { path = "../tje-session", optional = true }
genesis-config = { path = "../../vendor/jgenesis/config/genesis-config", optional = true }
sha1 = { version = "0.10", optional = true }

[[example]]
name = "profile_session"
required-features = ["preview"]
