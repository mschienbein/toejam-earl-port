[package]
name = "tje-extras"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared explicit profile selection for extended view and in-play Jam Out"

[features]
default = []
enhanced-mode = ["dep:tje-engine-runtime", "dep:tje-game", "tje-extended-view/enhanced-mode", "tje-jam-out/enhanced-mode"]

[dependencies]
tje-extended-view = { path = "../tje-extended-view" }
tje-jam-out = { path = "../tje-jam-out" }
tje-mem = { path = "../tje-mem" }
tje-game = { path = "../tje-game", optional = true }
tje-engine-runtime = { path = "../tje-engine-runtime", default-features = false, optional = true }
