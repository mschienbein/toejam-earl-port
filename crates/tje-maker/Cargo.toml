[package]
name = "tje-maker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded asset-free authored courses, local share codes and opt-in level loading"

[features]
default = []
enhanced-mode = ["dep:tje-game", "dep:tje-engine-runtime", "dep:genesis-config", "tje-engine-runtime/enhanced-mode"]
preview = ["enhanced-mode", "dep:tje-engine-cranelift", "dep:tje-session"]

[dependencies]
bincode = { version = "2", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tje-mem = { path = "../tje-mem" }
tje-rom = { path = "../tje-rom" }
tje-game = { path = "../tje-game", optional = true }
tje-engine-runtime = { path = "../tje-engine-runtime", default-features = false, optional = true }
tje-engine-cranelift = { path = "../tje-engine-cranelift", optional = true, features = ["enhanced-mode"] }
tje-session = { path = "../tje-session", optional = true }
genesis-config = { path = "../../vendor/jgenesis/config/genesis-config", optional = true }

[[example]]
name = "play_course"
required-features = ["preview"]
