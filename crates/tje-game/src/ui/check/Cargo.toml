[package]
name = "tje-ui-check"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Opt-in ROM-backed harness; keep the production game crate emulator-independent.
[workspace]

[[bin]]
name = "tje-ui-check"
path = "main.rs"

[dependencies]
serde_json = "1"
tje-game = { path = "../../.." }
tje-host = { path = "../../../../tje-host" }
tje-mem = { path = "../../../../tje-mem" }
