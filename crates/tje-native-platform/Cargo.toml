[package]
name = "tje-native-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
game-adapter = ["dep:tje-game"]

[dependencies]
tje-game = { path = "../tje-game", optional = true }
tje-mem = { path = "../tje-mem" }
genesis-core = { path = "../../vendor/jgenesis/backend/genesis-core", default-features = false }
genesis-components = { path = "../../vendor/jgenesis/backend/genesis-components", default-features = false }
genesis-config = { path = "../../vendor/jgenesis/config/genesis-config" }
jgenesis-common = { path = "../../vendor/jgenesis/common/jgenesis-common" }
ti-sn76489 = { path = "../../vendor/jgenesis/backend/ti-sn76489" }
z80-emu = { path = "../../vendor/jgenesis/cpu/z80-emu" }

[dev-dependencies]
bincode = "2"
tje-host = { path = "../tje-host" }
m68000-emu = { path = "../../vendor/jgenesis/cpu/m68000-emu" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
