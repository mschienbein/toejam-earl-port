[package]
name = "tje-simulation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded mode-owned session services and fail-closed ownership admission"

[features]
default = []
enhanced-mode = ["dep:tje-engine-runtime", "tje-engine-runtime/enhanced-mode", "tje-four-player/enhanced-mode"]

[dependencies]
bincode = "2"
sha2 = "0.10"
tje-game = { path = "../tje-game" }
tje-mem = { path = "../tje-mem" }
tje-world = { path = "../tje-world" }
tje-four-player = { path = "../tje-four-player" }
tje-engine-runtime = { path = "../tje-engine-runtime", optional = true, default-features = false }
