[package]
name = "tje-four-player"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Fail-closed four-seat enhanced-session primitives; not a playable campaign"

[features]
default = []
enhanced-mode = ["dep:tje-engine-runtime", "dep:tje-game", "dep:genesis-config", "tje-engine-runtime/enhanced-mode", "tje-world/enhanced-mode"]

[dependencies]
bincode = "2"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
tje-mem = { path = "../tje-mem" }
tje-rom = { path = "../tje-rom" }
tje-session = { path = "../tje-session" }
tje-world = { path = "../tje-world" }
tje-engine-runtime = { path = "../tje-engine-runtime", default-features = false, optional = true }
tje-game = { path = "../tje-game", optional = true }
genesis-config = { path = "../../vendor/jgenesis/config/genesis-config", optional = true }

[dev-dependencies]
serde_json = "1"
tje-native-platform = { path = "../tje-native-platform", default-features = false }
