name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: |
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          settings = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
          command = ["rustup", "toolchain", "install", settings["channel"],
                     "--profile", settings.get("profile", "minimal")]
          for component in settings.get("components", []):
              command.extend(["--component", component])
          for target in settings.get("targets", []):
              command.extend(["--target", target])
          subprocess.run(command, check=True)
          PY
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run ROM-free tests
        run: cargo test --locked --workspace
      - name: Run synthetic publication-gate regressions
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build WebAssembly
        # All workspace members are wasm-capable. Add an explicit --exclude PACKAGE
        # only for a native-only crate; keep new wasm crates covered by default.
        run: cargo build --locked --workspace --target wasm32-unknown-unknown
      - name: Audit public worktree, index and full history without ROMs
        run: python tools/audit_public.py --history --no-rom
