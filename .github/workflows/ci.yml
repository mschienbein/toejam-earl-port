name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: X64
          - os: windows-latest
            arch: X64
          - os: macos-14
            arch: ARM64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Install pinned audit grammars
        run: uv pip install --system --python 3.12 --requirement tools/audit_requirements.txt
      - name: Install Linux build packages (ALSA, udev, pkg-config)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev
      - name: Install pinned Rust toolchain
        run: |
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          settings = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
          command = ["rustup", "toolchain", "install", settings["channel"],
                     "--profile", settings.get("profile", "minimal")]
          for component in settings.get("components", []):
              command.extend(["--component", component])
          for target in settings.get("targets", []):
              command.extend(["--target", target])
          subprocess.run(command, check=True)
          PY
      - name: Confirm required runner architecture
        run: test "${{ runner.arch }}" = "${{ matrix.arch }}"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run ROM-free tests
        run: cargo test --locked --workspace
      - name: Check cross-target canonical audio hashes
        run: cargo test --locked --release -p tje-engine-verify audio::tests::canonical_audio_hashes_match_production_devices -- --nocapture
      - name: Execute cold and cached native code publication on ARM64
        if: runner.os == 'macOS'
        run: cargo test --release --locked -p tje-engine-cranelift --no-default-features --lib --tests --target aarch64-apple-darwin
      - name: Require real-time synthetic compiled-engine audio capacity
        run: cargo run --locked --release -p tje-engine-cranelift --example synthetic_capacity -- --frames 600
      - name: Run synthetic publication-gate regressions
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build WebAssembly
        # Desktop presentation and native code generation are native-only; all
        # other workspace members, including the runtime and Wasm emitter, build.
        run: cargo build --locked --workspace --target wasm32-unknown-unknown --exclude tje-native --exclude tje-engine-cranelift
      - name: Check generated function traceability
        run: python tools/trace_functions.py --check
      - name: Audit public worktree and published ancestry without ROMs
        run: |
          python tools/audit_public.py --no-rom
          python tools/audit_public.py --history --refs HEAD --no-rom
      - name: Install version-matched browser proof tools
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/browser-proof/browsers
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked --root "$RUNNER_TEMP/wasm-bindgen" --target-dir "$RUNNER_TEMP/bindgen-target"
          echo "$RUNNER_TEMP/wasm-bindgen/bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/browser-proof" --save-exact playwright@1.56.1
          "$RUNNER_TEMP/browser-proof/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check actual WebAssembly instructions, audio hashes and cache recovery
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-proof/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/browser-proof/browsers
          TJE_WASM_PROOF_DIR: ${{ github.workspace }}/scratch/ci-wasm-proof/pkg
        run: |
          bash crates/tje-engine-wasmgen/browser/build.sh
          node crates/tje-engine-wasmgen/browser/verify.mjs --primitives --report scratch/ci-wasm-proof/result.json
