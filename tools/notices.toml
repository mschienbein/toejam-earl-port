# Software selections are GPL-3.0-compatible; see docs/RELEASING.md.
# Prefer MIT when upstream offers an OR choice; AND obligations remain mandatory.
accepted = [
  "MIT", "Apache-2.0 WITH LLVM-exception", "Apache-2.0", "GPL-3.0-only",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false

# These apply to unchanged font assets, not software relicensing under GPL.
[epaint_default_fonts]
accepted = ["Bitstream-Vera", "OFL-1.1", "Ubuntu-font-1.0"]

# Less-common terms are accepted only for the reviewed packages that need them.
[arrayref]
accepted = ["BSD-2-Clause"]
# Native OS clipboard support: reviewed permissive Boost 1.0 terms; retain full notices.
[clipboard-win]
accepted = ["BSL-1.0"]
[error-code]
accepted = ["BSL-1.0"]
[foldhash]
accepted = ["Zlib"]
[inotify]
accepted = ["ISC"]
[inotify-sys]
accepted = ["ISC"]
[libloading]
accepted = ["ISC"]
[option-ext]
accepted = ["MPL-2.0"]
[tiny-skia]
accepted = ["BSD-3-Clause"]
[tiny-skia-path]
accepted = ["BSD-3-Clause"]
[unicode-ident]
accepted = ["Unicode-3.0"]
[zlib-rs]
accepted = ["Zlib"]

# The standalone upstream packages omit manifest licences. Their unchanged
# upstream GPL text is verified by checksum, never inferred from a crate name.
